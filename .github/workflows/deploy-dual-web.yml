name: Unified Vercel + Netlify Deployment & Release Synchronization

on:
  push:
    branches: [ "main" ]
    paths:
      - 'web/**'
      - 'netlify.toml'
      - 'scripts/**'
      - '.github/workflows/deploy-dual-web.yml'
  workflow_dispatch:
    inputs:
      force_redeploy:
        description: 'Force full dual redeployment & health check'
        required: false
        default: 'false'
        type: boolean

concurrency:
  group: deploy-dual-web-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ====================================================================
  # STEP 1: Pre-Flight Integrity & Cryptographic Validation
  # ====================================================================
  validate-release-artifacts:
    name: 1. Validate Release Artifacts & Checksums
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Pre-Flight Release Artifact Validation
        run: node scripts/validate_release_artifacts.mjs

  # ====================================================================
  # STEP 2: Deploy to Primary Hosting (Vercel)
  # ====================================================================
  deploy-vercel:
    name: 2. Deploy to Primary Hosting (Vercel)
    needs: validate-release-artifacts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Deploy web/ directory to Vercel Production
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          if [ -n "$VERCEL_TOKEN" ]; then
            echo "🚀 Deploying web/ directory directly to Vercel via Vercel CLI..."
            if [ -n "$VERCEL_ORG_ID" ] && [ -n "$VERCEL_PROJECT_ID" ]; then
              npx --yes vercel@latest deploy web --prod --yes --token="$VERCEL_TOKEN"
            else
              npx --yes vercel@latest deploy web --prod --yes --token="$VERCEL_TOKEN"
            fi
            echo "✅ Vercel production deployment command executed successfully."
          else
            echo "ℹ️  VERCEL_TOKEN is not configured in GitHub Secrets."
            echo "ℹ️  Relying on Vercel's native GitHub App integration for 'main' branch trigger."
            echo "ℹ️  To enforce synchronized CLI orchestration, configure VERCEL_TOKEN, VERCEL_ORG_ID, and VERCEL_PROJECT_ID in GitHub Repository Secrets."
          fi

  # ====================================================================
  # STEP 3: Deploy to Secondary Backup Hosting (Netlify)
  # ====================================================================
  deploy-netlify:
    name: 3. Deploy to Secondary Backup Hosting (Netlify)
    needs: validate-release-artifacts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Deploy web/ directory to Netlify Production
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: |
          if [ -z "$NETLIFY_AUTH_TOKEN" ] || [ -z "$NETLIFY_SITE_ID" ]; then
            echo "::error::MISSING NETLIFY DEPLOYMENT SECRETS!"
            echo "------------------------------------------------------------------"
            echo "The Netlify backup distribution endpoint cannot be deployed without:"
            echo "  1. NETLIFY_AUTH_TOKEN: Personal access token generated in Netlify User Settings -> Applications -> Personal access tokens."
            echo "  2. NETLIFY_SITE_ID: API Site ID found under Netlify Site Configuration -> General site settings -> Site details."
            echo ""
            echo "Please configure both in your GitHub Repository Settings:"
            echo "  https://github.com/itsafxal/LofiQ-Music/settings/secrets/actions"
            echo "------------------------------------------------------------------"
            exit 1
          fi

          echo "🚀 Deploying web/ directory directly to Netlify via Netlify CLI..."
          npx --yes netlify-cli@latest deploy --dir=web --prod --auth="$NETLIFY_AUTH_TOKEN" --site="$NETLIFY_SITE_ID"
          echo "✅ Netlify production deployment completed successfully."

  # ====================================================================
  # STEP 4: Post-Deployment Dual Endpoint Health & Synchronization Audit
  # ====================================================================
  verify-synchronization:
    name: 4. Verify Dual Release Synchronization & Health
    needs: [deploy-vercel, deploy-netlify]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run End-to-End Dual Endpoint Synchronization Check
        env:
          CI: "true"
          MAX_VERIFY_ATTEMPTS: "6"
        run: node scripts/verify_dual_deployments.mjs
