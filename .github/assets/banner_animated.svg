<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="auto">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a0c" />
      <stop offset="50%" stop-color="#0e0f14" />
      <stop offset="100%" stop-color="#050507" />
    </linearGradient>

    <!-- Glass Glow Gradients -->
    <radialGradient id="glow-cyan" cx="25%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glow-purple" cx="75%" cy="70%" r="65%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0" />
    </radialGradient>

    <!-- Metallic Text Gradient -->
    <linearGradient id="text-metallic" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="40%" stop-color="#e2e8f0" />
      <stop offset="70%" stop-color="#94a3b8" />
      <stop offset="100%" stop-color="#ffffff" />
    </linearGradient>

    <linearGradient id="accent-cyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>

    <filter id="glass-blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="40" />
    </filter>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <style>
      @keyframes wave-bounce {
        0%, 100% { height: 16px; transform: translateY(0); }
        50% { height: 56px; transform: translateY(-20px); }
      }
      @keyframes pulse-dot {
        0%, 100% { opacity: 0.3; transform: scale(0.95); }
        50% { opacity: 1; transform: scale(1.15); }
      }
      @keyframes badge-shimmer {
        0% { stop-color: #38bdf8; }
        50% { stop-color: #c084fc; }
        100% { stop-color: #38bdf8; }
      }
      .wave-bar {
        animation: wave-bounce 1.6s ease-in-out infinite;
        transform-origin: bottom;
      }
      .wb-1 { animation-delay: 0.0s; }
      .wb-2 { animation-delay: 0.15s; }
      .wb-3 { animation-delay: 0.3s; }
      .wb-4 { animation-delay: 0.45s; }
      .wb-5 { animation-delay: 0.6s; }
      .wb-6 { animation-delay: 0.75s; }
      .wb-7 { animation-delay: 0.9s; }
      .wb-8 { animation-delay: 1.05s; }
      .wb-9 { animation-delay: 1.2s; }
      .wb-10 { animation-delay: 1.35s; }
      .pulse-pill {
        animation: pulse-dot 2.4s ease-in-out infinite;
      }
    </style>
  </defs>

  <!-- Deep Canvas Background -->
  <rect width="1200" height="360" rx="20" fill="url(#bg-grad)" stroke="#27272a" stroke-width="1.5" />

  <!-- Ambient Glow Orbs -->
  <circle cx="280" cy="140" r="220" fill="url(#glow-cyan)" filter="url(#glass-blur)" />
  <circle cx="920" cy="220" r="260" fill="url(#glow-purple)" filter="url(#glass-blur)" />

  <!-- Grid Overlay -->
  <g opacity="0.06" stroke="#ffffff" stroke-width="0.8">
    <line x1="0" y1="60" x2="1200" y2="60" />
    <line x1="0" y1="120" x2="1200" y2="120" />
    <line x1="0" y1="180" x2="1200" y2="180" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="0" y1="300" x2="1200" y2="300" />
    <line x1="200" y1="0" x2="200" y2="360" />
    <line x1="400" y1="0" x2="400" y2="360" />
    <line x1="600" y1="0" x2="600" y2="360" />
    <line x1="800" y1="0" x2="800" y2="360" />
    <line x1="1000" y1="0" x2="1000" y2="360" />
  </g>

  <!-- Status Chip / Pill -->
  <g transform="translate(80, 52)">
    <rect width="260" height="34" rx="17" fill="#18181b" stroke="#3f3f46" stroke-width="1" />
    <circle cx="18" cy="17" r="5" fill="#22c55e" class="pulse-pill" />
    <text x="32" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#a1a1aa" letter-spacing="0.5">OFFICIAL RELEASE</text>
    <rect x="175" y="6" width="75" height="22" rx="11" fill="#27272a" />
    <text x="187" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#38bdf8">V1.0.1</text>
  </g>

  <!-- Brand Typography -->
  <g transform="translate(80, 160)">
    <text font-family="-apple-system, BlinkMacSystemFont, 'Outfit', 'Inter', 'Segoe UI', sans-serif" font-size="64" font-weight="900" fill="url(#text-metallic)" letter-spacing="-1.5">
      LofiQ
    </text>
    <text x="210" y="-8" font-family="-apple-system, BlinkMacSystemFont, 'JetBrains Mono', 'Fira Code', monospace" font-size="18" font-weight="600" fill="#38bdf8" letter-spacing="2">
      PRO
    </text>
  </g>

  <!-- Tagline -->
  <text x="82" y="206" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="19" font-weight="400" fill="#94a3b8" letter-spacing="0.2">
    High-Fidelity Audio Streaming • Real-Time Listen Together Lounges • Intelligent Multi-Resolver
  </text>

  <!-- Feature Pills -->
  <g transform="translate(80, 240)">
    <!-- Pill 1 -->
    <rect x="0" y="0" width="138" height="32" rx="8" fill="#141418" stroke="#27272a" stroke-width="1" />
    <text x="14" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="500" fill="#e2e8f0">🎧 320kbps Studio</text>

    <!-- Pill 2 -->
    <rect x="148" y="0" width="168" height="32" rx="8" fill="#141418" stroke="#27272a" stroke-width="1" />
    <text x="162" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="500" fill="#e2e8f0">👥 Firestore Sync Rooms</text>

    <!-- Pill 3 -->
    <rect x="326" y="0" width="148" height="32" rx="8" fill="#141418" stroke="#27272a" stroke-width="1" />
    <text x="340" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="500" fill="#e2e8f0">🎤 Synced Lyrics LRC</text>

    <!-- Pill 4 -->
    <rect x="484" y="0" width="142" height="32" rx="8" fill="#141418" stroke="#27272a" stroke-width="1" />
    <text x="498" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="500" fill="#e2e8f0">🛡️ App Check Shield</text>
  </g>

  <!-- Animated Soundwave Visualizer (Right Side) -->
  <g transform="translate(940, 190)" fill="url(#accent-cyan)" filter="url(#glow)">
    <rect x="0" y="0" width="6" height="24" rx="3" class="wave-bar wb-1" />
    <rect x="14" y="0" width="6" height="36" rx="3" class="wave-bar wb-2" />
    <rect x="28" y="0" width="6" height="52" rx="3" class="wave-bar wb-3" />
    <rect x="42" y="0" width="6" height="40" rx="3" class="wave-bar wb-4" />
    <rect x="56" y="0" width="6" height="60" rx="3" class="wave-bar wb-5" />
    <rect x="70" y="0" width="6" height="48" rx="3" class="wave-bar wb-6" />
    <rect x="84" y="0" width="6" height="56" rx="3" class="wave-bar wb-7" />
    <rect x="98" y="0" width="6" height="34" rx="3" class="wave-bar wb-8" />
    <rect x="112" y="0" width="6" height="44" rx="3" class="wave-bar wb-9" />
    <rect x="126" y="0" width="6" height="20" rx="3" class="wave-bar wb-10" />
  </g>

  <!-- Subtitle Footnote -->
  <text x="82" y="315" font-family="-apple-system, BlinkMacSystemFont, 'JetBrains Mono', monospace" font-size="12" font-weight="500" fill="#64748b">
    Target SDK 35 • Android 8.0+ • Jetpack Compose BOM 2024.12.01 • Media3 ExoPlayer 1.5.0
  </text>
</svg>
