[build]
  publish = "web"

[[redirects]]
  from = "/android-download"
  to = "/android-download.html"
  status = 200

[[redirects]]
  from = "/desktop-download"
  to = "/desktop-download.html"
  status = 200

[[redirects]]
  from = "/tv-download"
  to = "/tv-download.html"
  status = 200

[[redirects]]
  from = "/features"
  to = "/features.html"
  status = 200

[[redirects]]
  from = "/changelog"
  to = "/changelog.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"

[[headers]]
  for = "/downloads/*"
  [headers.values]
    Content-Disposition = "attachment"
    Cache-Control = "public, max-age=3600, must-revalidate"

[[headers]]
  for = "/version.json"
  [headers.values]
    Access-Control-Allow-Origin = "*"
    Cache-Control = "no-cache, no-store, must-revalidate"
    Pragma = "no-cache"
    Expires = "0"
